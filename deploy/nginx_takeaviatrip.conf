# Nginx konfiguratsiyasi — Take Avia Trip
#
# O'RNATISH:
#   1) "takeaviatrip.uz" so'zini butun faylda o'z domeningizga almashtiring.
#   2) Faylni serverga nusxalang:      /etc/nginx/sites-available/takeaviatrip.uz
#   3) Yoqish uchun symlink yarating:  sudo ln -s /etc/nginx/sites-available/takeaviatrip.uz /etc/nginx/sites-enabled/
#   4) Sozlamani tekshiring:           sudo nginx -t
#   5) Qayta yuklang:                  sudo systemctl reload nginx
#
# Eslatma: SSL (https) qismini bu faylga qo'lda yozish shart emas — 10-qadamda
# certbot buyrug'i ishga tushirilganda u avtomatik ravishda shu faylni
# tahrirlab, https uchun kerakli qismlarni o'zi qo'shib qo'yadi.

server {
    listen 80;
    listen [::]:80;
    server_name takeaviatrip.uz www.takeaviatrip.uz;

    # Formalar orqali (masalan rasm biriktirilgan murojaat) yuboriladigan
    # so'rovlar hajmi chegarasi.
    client_max_body_size 20M;

    # Statik fayllar (CSS/JS/rasm) — to'g'ridan-to'g'ri Nginx orqali,
    # Gunicorn/Django'ni band qilmasdan, tezroq beriladi.
    location /static/ {
        alias /var/www/takeavia_project/staticfiles/;
        expires 30d;
        access_log off;
    }

    # Admin panel orqali yuklangan rasmlar (media).
    location /media/ {
        alias /var/www/takeavia_project/media/;
        expires 30d;
        access_log off;
    }

    # Qolgan barcha so'rovlar — Gunicorn orqali Django ilovasiga.
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
